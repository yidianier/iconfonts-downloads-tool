name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: npm test
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: iconpack-extension
          path: dist/iconpack-*.zip
