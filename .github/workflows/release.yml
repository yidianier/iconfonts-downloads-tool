name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Verify tag and extension version
        run: |
          release_version="$(node -p 'JSON.parse(require("fs").readFileSync("extension/manifest.json", "utf8")).version')"
          test "$GITHUB_REF_NAME" = "v$release_version"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
      - run: npm test
      - run: npm run check
      - run: npm run package
      - name: Create checksum and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="$(node -p 'JSON.parse(require("fs").readFileSync("extension/manifest.json", "utf8")).version')"
          (cd dist && sha256sum "iconpack-$release_version.zip" > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" \
            "dist/iconpack-$release_version.zip" \
            dist/SHA256SUMS.txt \
            --verify-tag --latest \
            --title "Iconpack $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
